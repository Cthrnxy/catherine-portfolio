  if(!touchIntersects(fitTouchRect(ra,a.bounds),fitTouchRect(rb,b.bounds)))continue;
  const separateX=ra.x+ra.w<=rb.x+.05||rb.x+rb.w<=ra.x+.05;
  const separateY=ra.y+ra.h<=rb.y+.05||rb.y+rb.h<=ra.y+.05;
  if(!separateX&&!separateY)continue;
  if(separateX&&(!separateY||Math.abs((ra.x+ra.w/2)-(rb.x+rb.w/2))>=Math.abs((ra.y+ra.h/2)-(rb.y+rb.h/2)))){
   const [left,right]=ra.x<rb.x?[a,b]:[b,a],cut=(left.rect.x+left.rect.w+right.rect.x)/2;
   left.bounds.right=Math.min(left.bounds.right,cut);right.bounds.left=Math.max(right.bounds.left,cut);
  }else{
   const [above,below]=ra.y<rb.y?[a,b]:[b,a],cut=(above.rect.y+above.rect.h+below.rect.y)/2;
   above.bounds.bottom=Math.min(above.bounds.bottom,cut);below.bounds.top=Math.max(below.bounds.top,cut);
  }
 }
 for(const {button,rect,bounds} of items){
  const hit=fitTouchRect(rect,bounds);
  button.style.setProperty('--touch-left',(hit.x-rect.x)+'px');button.style.setProperty('--touch-top',(hit.y-rect.y)+'px');
  button.style.setProperty('--touch-width',hit.w+'px');button.style.setProperty('--touch-height',hit.h+'px');
  button.dataset.touchRect=JSON.stringify(hit);button.dataset.visualRect=JSON.stringify(rect);
  button.classList.toggle('tip-above',(rect.y+rect.h)/height>.84);
  // Keep hints on the screen when the target is close to an edge.
  button.classList.toggle('tip-left',button.dataset.tipAlign!=='center'&&(rect.x+rect.w/2)/width<.28);button.classList.toggle('tip-right',button.dataset.tipAlign!=='center'&&(rect.x+rect.w/2)/width>.72);
 }
}
// One header represents ordinary steps, Next Flow, and the completed state.
function syncDecisionHeader(){
 const root=document.getElementById('stage'),details=document.getElementById('decision-details');
 const next=!document.getElementById('next-flow').hidden,restart=!document.getElementById('restart').hidden;
 const state=next?'next':restart?'restart':'none';
 document.getElementById('details-heading').textContent=next?'Click Next Flow to continue':restart?'All flows completed':'Design details (Flow '+root.dataset.flow+')';
 details.classList.toggle('flow-next',next);
 details.classList.toggle('action-ready',state!=='none');
 root.classList.toggle('action-ready',state!=='none');
 root.dataset.actionState=state;
}
// Keep mobile progress below the artwork and anchor desktop guidance at lower left.
function arrangeDecisionLayout(){
 const root=document.getElementById('stage'),layout=document.getElementById('design-layout');
 const heading=document.getElementById('decision-heading'),phoneColumn=document.getElementById('phone-column');
 const details=document.getElementById('decision-details'),progress=document.getElementById('flow-progress');
 const title=document.getElementById('details-heading'),actions=document.getElementById('actions'),panel=document.getElementById('completion-panel');
 const guide=document.getElementById('screen-guide'),notes=document.getElementById('annotation-list')||document.getElementById('annotation');
 const mobile=mobileMode(),action=!document.getElementById('next-flow').hidden||!document.getElementById('restart').hidden;
 const placement=mobile?'mobile':'desktop',key=placement+':'+action;
 panel.hidden=mobile&&!action;
 if(root.dataset.layoutKey===key)return;
 if(mobile){
  phoneColumn.append(guide);
  if(action){panel.append(title,actions);details.append(panel,notes);}
  else details.append(title,notes,actions,panel);
  layout.append(heading,phoneColumn,progress,details);
 }else{
  if(action){panel.append(guide,title,actions);details.append(notes,panel);}
  else{panel.append(guide,actions);details.append(title,notes,panel);}
  layout.append(heading,details,phoneColumn);root.append(progress);
 }
 root.dataset.progressPlacement=placement;root.dataset.layoutKey=key;
}
function refreshMobileUI(options={}){
 syncDecisionHeader();
 arrangeDecisionLayout();
 ++mobileViewRevision;
 if(mobileViewFrame!==null){cancelAnimationFrame(mobileViewFrame);mobileViewFrame=null;}
 updateMobileSizing();refreshTouchTargets();
 if(!mobileMode()||!options.user)return;
 const revision=mobileViewRevision;
 mobileViewFrame=requestAnimationFrame(()=>{
  mobileViewFrame=null;if(revision!==mobileViewRevision||!mobileMode())return;
  let target,block='nearest';
  const next=document.getElementById('next-flow'),restart=document.getElementById('restart'),hot=document.getElementById('hotspot');
  if(options.flowStart||options.reset){target=document.getElementById('decision-heading');block='start';}
  else if(!next.hidden)target=next;
  else if(!restart.hidden)target=restart;
  else target=!hot.hidden?hot:document.getElementById('phone');
  if(!target)return;
  const rect=target.getBoundingClientRect(),height=mobileVisibleHeight();
  if(window.parent!==window&&window.scrollDecisionTarget)window.scrollDecisionTarget(target,block);else if(rect.top<16||rect.bottom>height-16)target.scrollIntoView({block,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
 });
}
function mobileResize(){arrangeDecisionLayout();updateMobileSizing();refreshTouchTargets();}
window.addEventListener('resize',mobileResize,{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',mobileResize,{passive:true});
updateMobileSizing();

hot.addEventListener('click',()=>{if(!typingActive&&STEPS[index].hot)activate(STEPS[index].hotAction||'next');});
anywhere.addEventListener('click',()=>{if(STEPS[index].anywhere)nextStep();});
$('next-flow').addEventListener('click',nextStep);$('restart').addEventListener('click',restart);
scroll.addEventListener('scroll',updateScrollState,{passive:true});
for(const event of ['wheel','touchstart','pointerdown','keydown'])scroll.addEventListener(event,cancelReveal,{passive:true});
stage.addEventListener('click',event=>{if(event.target.closest('button,a')||STEPS[index].scroll)return;hot.classList.remove('flash');void hot.offsetWidth;hot.classList.add('flash');});
hot.addEventListener('animationend',()=>hot.classList.remove('flash'));

// Native vertical page scrolling remains available while horizontal swipes
// select courses. Manual navigation pauses the demonstration timer.
let coursePointer=null,suppressCourseClickUntil=0;
function selectAdjacentCourse(delta){
 const s=STEPS[index];if(!s.courseNav)return;
 const current=['custodial','appliance','cna','english'].indexOf(s.img);
 const next=Math.max(0,Math.min(3,current+delta));
 if(next!==current)showStep(COURSE_STEPS[next],{manual:true,user:true});
}
device.addEventListener('keydown',event=>{
 if(!STEPS[index].courseNav||!['ArrowLeft','ArrowRight'].includes(event.key))return;
 event.preventDefault();selectAdjacentCourse(event.key==='ArrowRight'?1:-1);
});
device.addEventListener('pointerdown',event=>{
 coursePointer=STEPS[index].courseNav?{id:event.pointerId,x:event.clientX,y:event.clientY}:null;
},{passive:true});
device.addEventListener('pointercancel',()=>{coursePointer=null;},{passive:true});
device.addEventListener('pointerup',event=>{
 const start=coursePointer;coursePointer=null;
 if(!start||start.id!==event.pointerId||!STEPS[index].courseNav)return;
 const dx=event.clientX-start.x,dy=event.clientY-start.y;
 if(Math.abs(dx)<36||Math.abs(dx)<Math.abs(dy)*1.4)return;
 suppressCourseClickUntil=performance.now()+350;selectAdjacentCourse(dx<0?1:-1);
},{passive:true});
device.addEventListener('click',event=>{
 if(performance.now()<suppressCourseClickUntil){event.preventDefault();event.stopImmediatePropagation();}
},true);

document.addEventListener('visibilitychange',()=>{clearTimer();if(!document.hidden)startAutoplay(index);});

// Pause the mobile carousel while readers are viewing content below the screen.
let courseScreenVisible=true;
window.addEventListener('resize',()=>{clearTimer();startAutoplay(index);},{passive:true});
if(typeof IntersectionObserver!=='undefined'){
 const courseObserver=new IntersectionObserver(entries=>{
  const entry=entries.find(e=>e.target===device);if(!entry)return;
  const visible=entry.isIntersecting&&entry.intersectionRatio>=.35;
  if(visible===courseScreenVisible)return;
  courseScreenVisible=visible;
  if(mobileMode()){clearTimer();if(visible)startAutoplay(index);}
 },{threshold:[0,.35]});
 courseObserver.observe(device);
}

showStep(0);
window.DesignDecisionPreview={getStep:()=>index,getFlow:()=>STEPS[index].flow,goToStep:showStep,getSlides:()=>STEPS.map(s=>s.slide),getState:()=>({index,manualCarousel,scrollComplete,exitSaved,typingActive})};
</script></body></html>
