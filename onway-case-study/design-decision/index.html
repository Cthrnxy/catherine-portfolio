<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onway — Interactive design decisions V10</title><link rel="stylesheet" href="prototype-common.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/interactive-embed.css"></head>
<body>
<main class="page">
  <section class="shell" id="prototype" aria-label="Interactive Onway prototype">
    <header class="screen-help">
      <h1 id="screen-guide" aria-live="polite">Click the screen to find interactive areas</h1>
      <button class="restart-cta" id="restart">Restart</button>
    </header>
    <div class="stage" id="stage">
      <div class="phone-area">
      <div class="phone" id="phone"><div class="screen-surface"><img id="screen" alt="Onway checklist" draggable="false"><div id="controls"></div></div></div>
      <button id="baggage-next" class="baggage-next icon-button" type="button" aria-label="Next baggage screen" hidden><img id="baggage-arrow-icon" alt="" aria-hidden="true"></button>
      </div>
      <div id="annotation" aria-live="polite"></div>
    </div>
    <p class="sr-only" id="step-count" aria-live="polite"></p>
  </section>
</main>
<script src="app.js"></script>
<script src="../../shared/interactive-embed-child.js"></script></body>
</html>
