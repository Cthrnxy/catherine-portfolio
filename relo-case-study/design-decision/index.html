<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relo — Interactive design decisions</title><link rel="stylesheet" href="prototype-common.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/interactive-embed.css"></head>
<body><main class="page">
<section class="shell" id="location-flow" aria-label="Current and Next Unit interactive prototype">
<header class="screen-help"><h1 class="screen-guide" aria-live="polite">Click the screen to find interactive areas</h1><button class="restart-cta" type="button">Restart</button></header>
<div class="stage"><div class="phone-area"><div class="phone"><div class="screen-surface"><img class="screen" alt="Relo Current Unit" draggable="false"><div class="controls"></div></div></div><button class="flow-next icon-button" type="button" aria-label="Continue to approval flow" hidden><img alt="" aria-hidden="true"></button></div><div class="annotations" aria-live="polite"></div></div>
<p class="sr-only step-count" aria-live="polite"></p>
</section>
<section class="shell" id="approval-flow" aria-label="Be Approved interactive prototype" hidden>
<header class="screen-help"><h1 class="screen-guide" aria-live="polite">Click the screen to find interactive areas</h1><button class="restart-cta" type="button">Restart</button></header>
<div class="stage"><div class="phone-area"><div class="phone"><div class="screen-surface"><img class="screen" alt="Relo approval agreements" draggable="false"><div class="controls"></div></div></div></div><div class="annotations" aria-live="polite"></div></div>
<p class="sr-only step-count" aria-live="polite"></p>
</section>
</main><script src="app.js"></script><script src="../../shared/interactive-embed-child.js"></script></body></html>
